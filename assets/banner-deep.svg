<?xml version="1.0" encoding="UTF-8"?>
<!--
  「观澜」常驻个人主页横幅 · 深海蓝绿
  ····························································
  设计意图：
    · 一条持续走动的心跳线（服务器心率）横贯画面底部；
      一串端点沿对角线排开，被依次点亮 —— 这是轮询巡检的节奏，不指向任何日期。
    · 右上角是一枚扫描表盘：刻度环、缓慢转动的量程弧、中心「观澜」二字，
      代表那块一直在看的监控面板。
    · 全部为纯手写 SVG + 内嵌 CSS 动画，不引用任何外部图片 / 字体 / 统计接口，
      因此在 GitHub README 中以 <img> 方式加载也能正常动起来。
    · 加了 @media (prefers-reduced-motion: reduce)，系统开启「减少动态效果」时全部静止。

  改造指南：
    · 配色：集中在 <defs> 的渐变（背景、柔光）和各元素的 fill / stroke 里，直接搜色值替换；
      三套方案的完整色值对照表见仓库根目录 README.md。
    · 文案：在文件末尾「⑦ 文案」分组里，直接改 <text> 即可。
    · 节奏：动效时长在 <style> 里的 animation 中，把秒数调大就更慢、更克制。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="观澜 · 深海蓝绿 · 自托管监控">
  <title>观澜 · 自托管监控</title>
  <desc>个人主页横幅：心跳波形、巡检节点与扫描表盘，纯 SVG 动效。</desc>

  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#05161B"/>
      <stop offset="0.62" stop-color="#072329"/>
      <stop offset="1" stop-color="#0B3037"/>
    </linearGradient>

    <!-- 左上角柔光，给平面一点纵深 -->
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#1E8C84" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1E8C84" stop-opacity="0"/>
    </radialGradient>

    <!-- 点阵栅格：像监控面板的底图 -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#6FD8C9"/>
    </pattern>

    <!-- 波形左右两端淡出，避免生硬截断 -->
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.10" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.86" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="900" height="280" fill="url(#fadeX)"/>
    </mask>

    <clipPath id="frame"><rect width="900" height="280"/></clipPath>

    <style>
      /* 文案字体：优先系统中文字体，保证 GitHub 上各平台都能正常显示 */
      .zh { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .mark-zh { font-family: 'Songti SC','STSong','SimSun',serif; }

      /* 心跳线：整条路径向左平移一个周期（300px），无限循环，视觉上永不停顿 */
      .wave { animation: drift 9s linear infinite; }
      .wave-ghost { animation-duration: 15s; }
      @keyframes drift {
        from { transform: translateX(0); }
        to   { transform: translateX(-300px); }
      }

      /* 巡检节点：沿链路依次点亮。延迟由父级 --d 传入，五个点等距错开 */
      .n-core { opacity: 0.45; animation: node 5.5s linear infinite;
                 animation-delay: var(--d); }
      .n-halo { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%;
                 animation: halo 5.5s ease-out infinite; animation-delay: var(--d); }
      @keyframes node {
        0%   { opacity: 0.45; }
        4%   { opacity: 1; }
        16%  { opacity: 0.6; }
        100% { opacity: 0.45; }
      }
      @keyframes halo {
        0%   { opacity: 0; transform: scale(0.35); }
        4%   { opacity: 0.8; }
        18%  { opacity: 0; transform: scale(1.9); }
        100% { opacity: 0; transform: scale(1.9); }
      }

      /* 状态灯：核心明暗呼吸，外环周期性扩散 */
      .dot-core { animation: breathe 2.6s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.42; } }
      .dot-ring { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%;
                  animation: ping 2.6s ease-out infinite; }
      @keyframes ping {
        0%   { transform: scale(0.5); opacity: 0.55; }
        70%  { transform: scale(2.3); opacity: 0; }
        100% { opacity: 0; }
      }

      /* 表盘：外圈刻度环极慢自转；量程弧匀速扫一圈 */
      .dial-ring { transform-box: fill-box; transform-origin: 50% 50%;
                   animation: spin 60s linear infinite; }
      .dial-sweep { transform-box: fill-box; transform-origin: 50% 50%;
                    animation: spin 16s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* 尊重系统「减少动态效果」：所有装饰性动画归零，只保留静态构图 */
      @media (prefers-reduced-motion: reduce) {
        .wave, .wave-ghost, .n-core, .n-halo, .dot-core, .dot-ring,
        .dial-ring, .dial-sweep {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- ① 底色 + 柔光 + 点阵 -->
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#glow)"/>
    <rect width="900" height="280" fill="url(#grid)" opacity="0.12"/>
    

    <!-- ② 顶部时间轴刻度：给画面一条基准线 -->
    <path d="M64 40 H836" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M64 40 V46" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M92 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M120 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M148 40 V46" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M176 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M204 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M232 40 V46" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M260 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M288 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M316 40 V46" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M344 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M372 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M400 40 V46" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M428 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M456 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M484 40 V46" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M512 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M540 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M568 40 V46" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M596 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M624 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M652 40 V46" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M680 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M708 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M736 40 V46" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M764 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M792 40 V43" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>
    <path d="M820 40 V46" stroke="{rule}" stroke-width="0.8" opacity="0.22"/>

    <!-- ③ 心跳线（底层宽描边做微光，上层细线做主体，速度不同形成视差） -->
    <g mask="url(#fadeMask)">
      <g transform="translate(0 236)">
        <g class="wave wave-ghost">
          <path d="M0 0 L46 0 L54 -7 L62 5 L70 0 L112 0 L120 -22 L128 16 L136 -8 L142 0 L206 0 L212 -9 L218 7 L224 0 L300 0 L346 0 L354 -7 L362 5 L370 0 L412 0 L420 -22 L428 16 L436 -8 L442 0 L506 0 L512 -9 L518 7 L524 0 L600 0 L646 0 L654 -7 L662 5 L670 0 L712 0 L720 -22 L728 16 L736 -8 L742 0 L806 0 L812 -9 L818 7 L824 0 L900 0 L946 0 L954 -7 L962 5 L970 0 L1012 0 L1020 -22 L1028 16 L1036 -8 L1042 0 L1106 0 L1112 -9 L1118 7 L1124 0 L1200 0 L1246 0 L1254 -7 L1262 5 L1270 0 L1312 0 L1320 -22 L1328 16 L1336 -8 L1342 0 L1406 0 L1412 -9 L1418 7 L1424 0 L1500 0 L1546 0 L1554 -7 L1562 5 L1570 0 L1612 0 L1620 -22 L1628 16 L1636 -8 L1642 0 L1706 0 L1712 -9 L1718 7 L1724 0 L1800 0 L1846 0 L1854 -7 L1862 5 L1870 0 L1912 0 L1920 -22 L1928 16 L1936 -8 L1942 0 L2006 0 L2012 -9 L2018 7 L2024 0 L2100 0" fill="none" stroke="#2F8C86" stroke-width="6"
                stroke-opacity="0.16" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
      </g>
      <g transform="translate(0 236)">
        <g class="wave">
          <path d="M0 0 L46 0 L54 -7 L62 5 L70 0 L112 0 L120 -22 L128 16 L136 -8 L142 0 L206 0 L212 -9 L218 7 L224 0 L300 0 L346 0 L354 -7 L362 5 L370 0 L412 0 L420 -22 L428 16 L436 -8 L442 0 L506 0 L512 -9 L518 7 L524 0 L600 0 L646 0 L654 -7 L662 5 L670 0 L712 0 L720 -22 L728 16 L736 -8 L742 0 L806 0 L812 -9 L818 7 L824 0 L900 0 L946 0 L954 -7 L962 5 L970 0 L1012 0 L1020 -22 L1028 16 L1036 -8 L1042 0 L1106 0 L1112 -9 L1118 7 L1124 0 L1200 0 L1246 0 L1254 -7 L1262 5 L1270 0 L1312 0 L1320 -22 L1328 16 L1336 -8 L1342 0 L1406 0 L1412 -9 L1418 7 L1424 0 L1500 0 L1546 0 L1554 -7 L1562 5 L1570 0 L1612 0 L1620 -22 L1628 16 L1636 -8 L1642 0 L1706 0 L1712 -9 L1718 7 L1724 0 L1800 0 L1846 0 L1854 -7 L1862 5 L1870 0 L1912 0 L1920 -22 L1928 16 L1936 -8 L1942 0 L2006 0 L2012 -9 L2018 7 L2024 0 L2100 0" fill="none" stroke="#63CEC2" stroke-width="1.6"
                stroke-linejoin="round" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- ④ 巡检链路：虚线连接五个端点，端点自左下向右上依次点亮 -->
    <path d="M556 216 L752 144" fill="none" stroke="#2F8C86" stroke-width="1"
          stroke-opacity="0.45" stroke-dasharray="3 6" stroke-linecap="round"/>
    <g class="node" transform="translate(556 216)" style="--d:0.00s">
      <circle class="n-halo" r="8" fill="none" stroke="{accent}" stroke-width="1"/>
      <circle class="n-core" r="3" fill="{accent}"/>
    </g>
    <g class="node" transform="translate(605 198)" style="--d:0.45s">
      <circle class="n-halo" r="8" fill="none" stroke="{accent}" stroke-width="1"/>
      <circle class="n-core" r="3" fill="{accent}"/>
    </g>
    <g class="node" transform="translate(654 180)" style="--d:0.90s">
      <circle class="n-halo" r="8" fill="none" stroke="{accent}" stroke-width="1"/>
      <circle class="n-core" r="3" fill="{accent}"/>
    </g>
    <g class="node" transform="translate(703 162)" style="--d:1.35s">
      <circle class="n-halo" r="8" fill="none" stroke="{accent}" stroke-width="1"/>
      <circle class="n-core" r="3" fill="{accent}"/>
    </g>
    <g class="node" transform="translate(752 144)" style="--d:1.80s">
      <circle class="n-halo" r="8" fill="none" stroke="{accent}" stroke-width="1"/>
      <circle class="n-core" r="3" fill="{accent}"/>
    </g>

    <!-- ⑤ 扫描表盘：刻度环 + 量程弧 + 中心「观澜」 -->
    <g transform="translate(806 96)">
      <circle class="dial-ring" r="47" fill="none" stroke="#7BE3D2" stroke-width="1"
              stroke-dasharray="1.6 5.4" opacity="0.55"/>
      <circle r="36" fill="none" stroke="#7BE3D2" stroke-width="0.8" opacity="0.35"/>
      <circle class="dial-sweep" r="36" fill="none" stroke="#7BE3D2" stroke-width="2"
              stroke-dasharray="44 182" stroke-linecap="round" opacity="0.9"/>
      <text class="mark-zh" x="0" y="-5" text-anchor="middle" font-size="18"
            fill="#7BE3D2">观</text>
      <text class="mark-zh" x="0" y="19" text-anchor="middle" font-size="18"
            fill="#7BE3D2">澜</text>
    </g>

    <!-- ⑥ 文案 -->
    <text class="mono" x="64" y="82" font-size="11" letter-spacing="3"
          fill="#86A6AA">OBSERVABILITY · SELF-HOSTED · HK</text>
    <text class="zh" x="64" y="152" font-size="36" font-weight="600" letter-spacing="1.2"
          fill="#ECF7F4">白天写业务，夜里看曲线</text>

    <!-- 状态灯 + 身份行 -->
    <g transform="translate(69 179)">
      <circle class="dot-ring" r="4.5" fill="none" stroke="#7BE3D2" stroke-width="1.2"/>
      <circle class="dot-core" r="3.4" fill="#7BE3D2"/>
    </g>
    <text class="zh" x="86" y="184" font-size="13.5" letter-spacing="0.6" fill="#86A6AA">yabingwang — 观澜，自托管监控面板</text>

    <!-- ⑦ 边缘小字 -->
    <text class="mono" x="64" y="270" font-size="9.5" letter-spacing="1.8"
          fill="#86A6AA" opacity="0.45">22.3193° N · 114.1694° E</text>
    <text class="mono" x="836" y="270" font-size="9.5" letter-spacing="1.4"
          fill="#86A6AA" opacity="0.45" text-anchor="end">github.com/yabingwang</text>
  </g>
</svg>
