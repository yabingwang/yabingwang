<?xml version="1.0" encoding="UTF-8"?>
<!--
  个人主页横幅 · 深海蓝绿
  ································································
  四层结构，每一层都在说「有东西在被持续看着」：
    1) 点阵栅格 + 极淡横线 —— 面板底图，给画面纵深；
    2) 扫描带 —— 自上而下缓慢掠过，经过时把栅格提亮一档；
    3) 心跳线 —— 底部持续走动的一条脉搏，底层另有一条更慢的宽描边做视差；
    4) 链路 —— 五个节点被虚线串起，一枚数据脉冲从起点跑到终点，
       每到一个节点它亮一次（脉冲 1.8s 走完全程，节点间隔 0.45s，节奏严格对齐）。
  右上角仪表盘：刻度环 60s 转一圈、量程弧 16s 扫一圈、中心一对花括号。
  右下角终端光标呼吸；系统开启「减少动态效果」时全部静止。

  改造指南：配色集中在 <defs> 渐变与各元素 fill / stroke；文案在「⑥ 文案」；
  节奏在 <style> 的 animation 秒数里。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280"
     role="img" aria-label="个人主页横幅 · 深海蓝绿">
  <title>yabingwang · 个人主页横幅</title>
  <desc>扫描栅格、心跳线、数据链路与仪表盘，纯 SVG 动效。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#05161B"/>
      <stop offset="0.62" stop-color="#072329"/>
      <stop offset="1" stop-color="#0B3037"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.78">
      <stop offset="0" stop-color="#1E8C84" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1E8C84" stop-opacity="0"/>
    </radialGradient>

    <!-- 点阵栅格 -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#6FD8C9"/>
    </pattern>

    <!-- 扫描带：上淡下亮，底边一道细线即扫描头 -->
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BE3D2" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#7BE3D2" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#7BE3D2" stop-opacity="0.16"/>
    </linearGradient>

    <!-- 波形两端淡出 -->
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.10" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.86" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="900" height="280" fill="url(#fadeX)"/></mask>
    <clipPath id="frame"><rect width="900" height="280"/></clipPath>

    <style>
      .zh { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }

      /* 心跳线：向左平移一个周期后无缝接回 */
      .wave { animation: drift 9s linear infinite; }
      .wave-ghost { animation-duration: 15s; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-300px); } }

      /* 扫描带：11 秒自上而下走一遍，把栅格「提亮一档」 */
      .scan { animation: scan 11s linear infinite; }
      @keyframes scan { from { transform: translateY(0); } to { transform: translateY(380px); } }

      /* 数据脉冲：1.8s 跑完 252 单位链路，与节点依次点亮严格同步 */
      .flow { animation: flow 5.5s linear infinite; }
      @keyframes flow {
        0%   { stroke-dashoffset: 252; }
        32.7% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }

      /* 节点：被脉冲扫到时亮起并扩散一圈 */
      .n-core { opacity: 0.42; animation: node 5.5s linear infinite; animation-delay: var(--d); }
      .n-halo { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%;
                 animation: halo 5.5s ease-out infinite; animation-delay: var(--d); }
      @keyframes node {
        0% { opacity: 0.42; } 4% { opacity: 1; } 18% { opacity: 0.6; } 100% { opacity: 0.42; }
      }
      @keyframes halo {
        0% { opacity: 0; transform: scale(0.35); }
        4% { opacity: 0.85; }
        20% { opacity: 0; transform: scale(2); }
        100% { opacity: 0; transform: scale(2); }
      }

      /* 仪表盘 */
      .dial-ring { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 60s linear infinite; }
      .dial-sweep { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 16s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* 状态灯 + 终端光标 */
      .dot-core { animation: breathe 2.6s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.42; } }
      .dot-ring { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%;
                  animation: ping 2.6s ease-out infinite; }
      @keyframes ping {
        0% { transform: scale(0.5); opacity: 0.55; }
        70% { transform: scale(2.3); opacity: 0; }
        100% { opacity: 0; }
      }
      .cursor { animation: blink 1.15s steps(1, end) infinite; }
      @keyframes blink { 0%, 49% { opacity: 0.85; } 50%, 100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .wave, .wave-ghost, .scan, .flow, .n-core, .n-halo,
        .dot-core, .dot-ring, .dial-ring, .dial-sweep, .cursor { animation: none !important; }
        .cursor { opacity: 0.85; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- ① 底色、柔光、栅格与极淡横线 -->
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#glow)"/>
    <g opacity="0.12">
      <rect width="900" height="280" fill="url(#grid)"/>
      <g stroke="#6FD8C9" stroke-width="0.5">
        <path d="M0 70 H900"/><path d="M0 140 H900"/><path d="M0 210 H900"/>
      </g>
    </g>
    

    <!-- ② 顶部刻度轴 -->
    <path d="M64 40 H836" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M64 40 V46" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M92 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M120 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M148 40 V46" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M176 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M204 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M232 40 V46" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M260 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M288 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M316 40 V46" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M344 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M372 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M400 40 V46" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M428 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M456 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M484 40 V46" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M512 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M540 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M568 40 V46" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M596 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M624 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M652 40 V46" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M680 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M708 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M736 40 V46" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M764 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M792 40 V43" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>
    <path d="M820 40 V46" stroke="#6FD8C9" stroke-width="0.8" opacity="0.28"/>

    <!-- ③ 扫描带（在栅格之上、文字之下，只提亮底图） -->
    <g class="scan">
      <rect x="0" y="-90" width="900" height="90" fill="url(#scanG)"/>
      <rect x="0" y="-1" width="900" height="1" fill="#7BE3D2" opacity="0.22"/>
    </g>

    <!-- ④ 心跳线（宽描边微光 + 细线主体，速度不同形成视差） -->
    <g mask="url(#fadeMask)">
      <g transform="translate(0 236)">
        <g class="wave wave-ghost">
          <path d="M0 0 L46 0 L54 -7 L62 5 L70 0 L112 0 L120 -22 L128 16 L136 -8 L142 0 L206 0 L212 -9 L218 7 L224 0 L300 0 L346 0 L354 -7 L362 5 L370 0 L412 0 L420 -22 L428 16 L436 -8 L442 0 L506 0 L512 -9 L518 7 L524 0 L600 0 L646 0 L654 -7 L662 5 L670 0 L712 0 L720 -22 L728 16 L736 -8 L742 0 L806 0 L812 -9 L818 7 L824 0 L900 0 L946 0 L954 -7 L962 5 L970 0 L1012 0 L1020 -22 L1028 16 L1036 -8 L1042 0 L1106 0 L1112 -9 L1118 7 L1124 0 L1200 0 L1246 0 L1254 -7 L1262 5 L1270 0 L1312 0 L1320 -22 L1328 16 L1336 -8 L1342 0 L1406 0 L1412 -9 L1418 7 L1424 0 L1500 0 L1546 0 L1554 -7 L1562 5 L1570 0 L1612 0 L1620 -22 L1628 16 L1636 -8 L1642 0 L1706 0 L1712 -9 L1718 7 L1724 0 L1800 0 L1846 0 L1854 -7 L1862 5 L1870 0 L1912 0 L1920 -22 L1928 16 L1936 -8 L1942 0 L2006 0 L2012 -9 L2018 7 L2024 0 L2100 0" fill="none" stroke="#2F8C86" stroke-width="6"
                stroke-opacity="0.16" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
      </g>
      <g transform="translate(0 236)">
        <g class="wave">
          <path d="M0 0 L46 0 L54 -7 L62 5 L70 0 L112 0 L120 -22 L128 16 L136 -8 L142 0 L206 0 L212 -9 L218 7 L224 0 L300 0 L346 0 L354 -7 L362 5 L370 0 L412 0 L420 -22 L428 16 L436 -8 L442 0 L506 0 L512 -9 L518 7 L524 0 L600 0 L646 0 L654 -7 L662 5 L670 0 L712 0 L720 -22 L728 16 L736 -8 L742 0 L806 0 L812 -9 L818 7 L824 0 L900 0 L946 0 L954 -7 L962 5 L970 0 L1012 0 L1020 -22 L1028 16 L1036 -8 L1042 0 L1106 0 L1112 -9 L1118 7 L1124 0 L1200 0 L1246 0 L1254 -7 L1262 5 L1270 0 L1312 0 L1320 -22 L1328 16 L1336 -8 L1342 0 L1406 0 L1412 -9 L1418 7 L1424 0 L1500 0 L1546 0 L1554 -7 L1562 5 L1570 0 L1612 0 L1620 -22 L1628 16 L1636 -8 L1642 0 L1706 0 L1712 -9 L1718 7 L1724 0 L1800 0 L1846 0 L1854 -7 L1862 5 L1870 0 L1912 0 L1920 -22 L1928 16 L1936 -8 L1942 0 L2006 0 L2012 -9 L2018 7 L2024 0 L2100 0" fill="none" stroke="#63CEC2" stroke-width="1.6"
                stroke-linejoin="round" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- ⑤ 链路：虚线 + 流动的数据脉冲 + 五个节点 -->
    <path d="M556 216 L752 144" fill="none" stroke="#2F8C86" stroke-width="1"
          stroke-opacity="0.42" stroke-dasharray="3 6" stroke-linecap="round"/>
    <path class="flow" d="M556 216 L752 144" fill="none" stroke="#7BE3D2" stroke-width="1.8"
          stroke-linecap="round" stroke-dasharray="10 242" pathLength="252"/>
    <g class="node" transform="translate(556 216)" style="--d:0.00s">
      <circle class="n-halo" r="8" fill="none" stroke="#7BE3D2" stroke-width="1"/>
      <circle class="n-core" r="3" fill="#7BE3D2"/>
    </g>
    <g class="node" transform="translate(605 198)" style="--d:0.45s">
      <circle class="n-halo" r="8" fill="none" stroke="#7BE3D2" stroke-width="1"/>
      <circle class="n-core" r="3" fill="#7BE3D2"/>
    </g>
    <g class="node" transform="translate(654 180)" style="--d:0.90s">
      <circle class="n-halo" r="8" fill="none" stroke="#7BE3D2" stroke-width="1"/>
      <circle class="n-core" r="3" fill="#7BE3D2"/>
    </g>
    <g class="node" transform="translate(703 162)" style="--d:1.35s">
      <circle class="n-halo" r="8" fill="none" stroke="#7BE3D2" stroke-width="1"/>
      <circle class="n-core" r="3" fill="#7BE3D2"/>
    </g>
    <g class="node" transform="translate(752 144)" style="--d:1.80s">
      <circle class="n-halo" r="8" fill="none" stroke="#7BE3D2" stroke-width="1"/>
      <circle class="n-core" r="3" fill="#7BE3D2"/>
    </g>

    <!-- ⑥ 仪表盘：刻度环 + 量程弧 + 花括号 -->
    <g transform="translate(806 96)">
      <circle class="dial-ring" r="47" fill="none" stroke="#7BE3D2" stroke-width="1"
              stroke-dasharray="1.6 5.4" opacity="0.55"/>
      <circle r="36" fill="none" stroke="#7BE3D2" stroke-width="0.8" opacity="0.32"/>
      <circle class="dial-sweep" r="36" fill="none" stroke="#7BE3D2" stroke-width="2"
              stroke-dasharray="44 182" stroke-linecap="round" opacity="0.9"/>
      <text class="mono" x="0" y="6" text-anchor="middle" font-size="16"
            letter-spacing="1.5" fill="#7BE3D2">{ }</text>
    </g>

    <!-- ⑦ 文案 -->
    <text class="zh" x="64" y="152" font-size="42" font-weight="600" letter-spacing="1.2"
          fill="#ECF7F4">代码要经得起换人</text>
    <g transform="translate(69 179)">
      <circle class="dot-ring" r="4.5" fill="none" stroke="#7BE3D2" stroke-width="1.2"/>
      <circle class="dot-core" r="3.4" fill="#7BE3D2"/>
    </g>
    <text class="zh" x="86" y="184" font-size="13.5" letter-spacing="0.6"
          fill="#86A6AA">yabingwang — 程序员，在意可读性</text>
    <rect class="cursor" x="312" y="172" width="2" height="13" fill="#7BE3D2" opacity="0.85"/>

    <!-- ⑧ 右下角链接 -->
    <text class="mono" x="836" y="270" font-size="9.5" letter-spacing="1.4"
          fill="#86A6AA" opacity="0.45" text-anchor="end">github.com/yabingwang</text>
  </g>
</svg>
