<?xml version="1.0" encoding="UTF-8"?>
<!--
  状态卡 · 暖白纸感
  一个呼吸的圆点、一个 NOW 标签、一行正在写的动作和一个终端光标。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="360" height="72"
     role="img" aria-label="状态：正在写代码">
  <title>状态卡</title>
  <defs>
    <style>
      .zh { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .pulse { transform-box: fill-box; transform-origin: 50% 50%; animation: ping 2.4s ease-out infinite; }
      @keyframes ping {
        0% { transform: scale(0.6); opacity: 0.6; }
        70% { transform: scale(2.6); opacity: 0; }
        100% { opacity: 0; }
      }
      .cursor { animation: blink 1.1s steps(1, end) infinite; }
      @keyframes blink { 0%, 49% { opacity: 0.9; } 50%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .cursor { animation: none !important; }
        .cursor { opacity: 0.9; }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="359" height="71" rx="9" fill="#FFFFFF" stroke="#36666A" stroke-opacity="0.22"/>
  <g transform="translate(24 36)">
    <circle class="pulse" r="4" fill="none" stroke="#36666A" stroke-width="1"/>
    <circle r="3.2" fill="#36666A"/>
  </g>
  <text class="mono" x="44" y="30" font-size="9" letter-spacing="2.4" fill="#7A7266">NOW</text>
  <text class="zh" x="44" y="50" font-size="13.5" letter-spacing="0.6" fill="#23282A">写代码，也在改边界</text>
  <rect class="cursor" x="190" y="37" width="2" height="15" fill="#36666A" opacity="0.9"/>
  <text class="mono" x="336" y="30" font-size="9" letter-spacing="1.6" fill="#7A7266" opacity="0.6"
        text-anchor="end">LIVE</text>
</svg>
